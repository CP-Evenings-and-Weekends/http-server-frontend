<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Horror Character Generator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="app.js"
        defer
    ></script>
</head>

<body>
    <main>
        <h1>Nightmare Generator</h1>

        <p class="subtitle">
            Summon a horror icon if you dare...
        </p>

        <button
            id="character-button"
            type="button"
        >
            Click Here
        </button>

        <div id="character-container">
            <h2 id="character-name">
                Your villain awaits
            </h2>

            <p id="movie-title">
                Click the button to begin.
            </p>
        </div>

        <p
            id="error-message"
            class="error-message"
        ></p>
    </main>
</body>
</html>
